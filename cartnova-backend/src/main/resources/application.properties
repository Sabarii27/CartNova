spring.application.name=cartnova-backend
server.port=8080

# ---------- MySQL ----------
# Every value can be overridden with an environment variable (IntelliJ Run Configuration or Docker).
# The default password below is for LOCAL DEVELOPMENT only - change it to your own MySQL root password.
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:cartnova}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=sabari2710#

# ---------- JPA / Hibernate ----------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# ---------- JWT ----------
# Must be at least 32 characters. The default is for LOCAL DEVELOPMENT only; set JWT_SECRET in any real environment.
app.jwt.secret=${JWT_SECRET:cartnova-local-dev-secret-key-change-me-0123456789}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# ---------- CORS ----------
# Comma-separated list of allowed browser origins.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# ---------- Seed data (LOCAL DEVELOPMENT) ----------
app.seed.enabled=${SEED_ENABLED:true}
app.seed.admin-name=Store Admin
app.seed.admin-email=${ADMIN_EMAIL:admin@cartnova.com}
app.seed.admin-password=${ADMIN_PASSWORD:Admin@123}

# Never return stack traces or internal messages to clients
server.error.include-stacktrace=never
server.error.include-message=never
